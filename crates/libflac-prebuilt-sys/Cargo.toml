[package]
name = "libflac-prebuilt-sys"
version.workspace = true
edition = "2021"
# 2021, not 2024, and no MSRV-raising syntax: this crate's whole job is to be linkable from
# other people's projects, so it should not be the thing that forces a toolchain upgrade on any
# of them.
#
# 1.77 rather than something older because bindgen writes the layout assertions in
# src/bindings.rs with `std::mem::offset_of!`, which is where they stabilised. It is *not* 1.82:
# that is what bindgen's default `--rust-target` would have cost, by emitting `unsafe extern "C"`
# blocks, and gen-bindings.sh pins the target to 1.81 to keep it from doing so. This number is a
# measurement of what the generated file needs, so check it after a bindgen bump.
rust-version = "1.77"
description = "Raw FFI for libFLAC's stream encoder and decoder, linked from a prebuilt static archive — no cmake, no pkg-config, no libclang, and no shared library at run time"
# libFLAC is BSD-3-Clause (COPYING.Xiph, which every archive ships and the repository root
# carries as LICENSE). The `flac` and `metaflac` programs are GPL and are not built.
license = "BSD-3-Clause"
repository = "https://github.com/andrewtheguy/libflac-prebuilt"
# Declared so that two crates linking libFLAC into one binary is a cargo error rather than a
# duplicate-symbol link error, and so consumers can read DEP_FLAC_INCLUDE.
links = "FLAC"
build = "build.rs"
# git-only, deliberately: the archives are what makes this crate work and they are binary
# files that live on releases rather than in the crate.
publish = false

# `flac_sys`, so a consumer writes `use flac_sys::…`.
[lib]
name = "flac_sys"
path = "src/lib.rs"

[dependencies]
